name: AI Service CI

# Independent of the backend and frontend workflows, so a failure there never blocks an
# ai-service-only PR. No path filter: it runs on every PR, so the check is always reported.
# Tests only for now — ruff + black arrive in task 0.5b, which adds the lint step here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/uv.lock

      # uv is the project's package manager (ai-service/CLAUDE.md); installed from PyPI to
      # avoid a third-party action.
      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest
