name: Frontend CI

# Independent of the backend and ai-service workflows, so a failure there never blocks a
# frontend-only PR. Runs only when the PR touches frontend/ or this workflow file; a PR that
# touches neither gets no frontend check at all (that is expected, not a missing check).
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
