spring.application.name=backend

# Datasource: no spring.datasource.* keys here on purpose. Spring Boot's relaxed binding reads
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD straight from
# the environment (see backend/.env.example), and there is deliberately no default, so a missing
# value fails at startup instead of silently pointing somewhere else. Tests get their database
# from Testcontainers instead. Replaced by application.yml profiles in 2.1a.

# Schema changes go through Flyway migrations only. Hibernate just verifies the entities
# match what the migrations created and never alters the schema.
spring.jpa.hibernate.ddl-auto=validate
