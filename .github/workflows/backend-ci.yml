name: Backend CI

# Independent of the ai-service and frontend workflows, so a failure there never blocks a
# backend-only PR. Runs only when the PR touches backend/, infra/sandbox/ (the sandbox tests
# build the runner images from it), the AI service's contract (AiContractMirrorTests reads it,
# 7.1a) or this workflow file; a PR that touches none of them gets no backend check at all (that
# is expected, not a missing check).
on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/sandbox/**"
      - "ai-service/src/ai_service/schemas.py"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # GitHub-hosted Ubuntu runners already include Docker, which the Testcontainers-backed
      # tests (from 1.1a) and the sandbox tests (Phase 4) will need.
      - name: Build and test
        run: ./mvnw -B verify
