spring:
  application:
    name: backend
  jpa:
    hibernate:
      # Schema changes go through Flyway migrations only. Hibernate just verifies the entities
      # match what the migrations created and never alters the schema.
      ddl-auto: validate
    # Off (7.7a): Spring's default keeps the connection of a request's first read checked out until
    # the response is written, so a hint request would hold one through the whole AI call (up to the
    # read timeout) and a few slow ones would empty the pool the grading worker needs. No entity has
    # JPA associations, so nothing loads lazily after a service method returns.
    open-in-view: false
  servlet:
    multipart:
      # Uploads are a submission's source file only (5.1b), capped at SubmissionService.SOURCE_MAX_BYTES
      # (128 KiB); these are the server's hard bound above that cap, and must stay above it. The threshold
      # above the request size keeps every part in memory: an upload is never written to disk.
      max-file-size: 1MB
      max-request-size: 1MB
      file-size-threshold: 2MB
  flyway:
    # The production migration path, stated explicitly: dev-only seed data (db/dev-seed) must
    # never be added here, only by the `dev` profile below.
    locations: classpath:db/migration

# JWT: `jwt.secret` is bound from the JWT_SECRET environment variable and deliberately has no
# default in any profile (a missing or short secret stops the application at startup).
jwt:
  expiration: 24h

# The languages the sandbox runs, and the only list of languages an assignment may use (4.1b).
# A new language is a new entry here plus an image under infra/sandbox/ - no code changes. The key is
# the language id (upper-case). Commands are argument lists, not shell strings; they run in the
# container's working directory, where `source-file-name` is written. Java: the file name must match the
# public class (`Main`). Each image is built from infra/sandbox/<language> under the name given here (4.2b).
sandbox:
  languages:
    JAVA:
      image: grading-sandbox-java:dev
      source-file-name: Main.java
      compile-command: [javac, -encoding, UTF-8, Main.java]
      run-command: [java, -cp, ., Main]
      # 7.1c: an assignment's memory limit may not be lower. At 64 MB a JVM start stalled past the time limit
      # on the CI runner (PR #140). A language without the key has no minimum.
      min-memory-mb: 128
    PYTHON:
      image: grading-sandbox-python:dev
      source-file-name: main.py
      run-command: [python, main.py]

# The submission worker pool (5.2a, SubmissionWorkerProperties). Placeholders pending tuning: how many
# submissions are graded at once (each runs its tests one at a time, one CPU per container) and how
# many more wait in memory. A submission beyond both is never refused: it stays QUEUED in the database
# and is picked up when a place frees. Both must be at least 1.
submissions:
  worker:
    pool-size: 2
    queue-capacity: 100

# The AI service (7.1a, ai/AiServiceProperties). `ai.service.url` and `ai.service.token` come from the
# AI_SERVICE_URL and AI_SERVICE_TOKEN environment variables and deliberately have no default: a missing
# one stops the application at startup (like JWT_SECRET). The timeouts are placeholders pending tuning;
# override them with AI_SERVICE_CONNECTTIMEOUT / AI_SERVICE_READTIMEOUT. The read timeout must outlast
# the AI service's own worst case: two Gemini attempts of up to 30 s each (ai-service, 6.2a/6.3c). A
# student waits for a hint at most this long.
ai:
  service:
    connect-timeout: 5s
    read-timeout: 70s

# Datasource: the SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD environment variables bind
# straight to spring.datasource.* (relaxed binding, see backend/.env.example) and always win over
# anything below. No profile is active by default: choose one with SPRING_PROFILES_ACTIVE.
# (Tests run with no profile; they get their database from Testcontainers.)
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Fallbacks matching the compose database in /infra, so `dev` only needs the password.
    # The password has no fallback on purpose: compose requires you to choose one.
    url: jdbc:postgresql://localhost:5432/grading
    username: grading
  flyway:
    # Schema migrations plus the dev-only seed data. Seed versions start at 1000, so a database
    # that already ran them would reject a schema migration added later (say V11) as "resolved
    # migration not applied". Out-of-order lets that migration still apply. It is limited to dev
    # on purpose: production has no seed rows, so there migrations stay strictly in order.
    locations: classpath:db/migration,classpath:db/dev-seed
    out-of-order: true
---
spring:
  config:
    activate:
      on-profile: prod
# Deliberately no datasource keys: a missing SPRING_DATASOURCE_* variable must stop the
# application at startup ("Failed to configure a DataSource"), never fall back to a local database.
