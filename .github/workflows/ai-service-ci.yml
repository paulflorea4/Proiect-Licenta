name: AI Service CI

# Independent of the backend and frontend workflows, so a failure there never blocks an
# ai-service-only PR. Runs only when the PR touches ai-service/, the backend's TestOutcome.java
# (test_the_outcomes_are_exactly_the_backends reads it, 6.3a) or this workflow file; a PR that
# touches none of them gets no ai-service check at all (that is expected, not a missing check).
on:
  pull_request:
    paths:
      - "ai-service/**"
      - "backend/src/main/java/com/gradingplatform/backend/sandbox/TestOutcome.java"
      - ".github/workflows/ai-service-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/uv.lock

      # uv is the project's package manager (ai-service/CLAUDE.md); installed from PyPI to
      # avoid a third-party action.
      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Test
        run: uv run pytest
